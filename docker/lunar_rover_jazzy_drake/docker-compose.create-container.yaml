services:
  drake:
    image: ${CONTAINER_NAME}:latest
    container_name: ${CONTAINER_NAME}
    hostname: ${CONTAINER_NAME}
    privileged: true
    environment:
      TERM: xterm-256color
      DISPLAY: $DISPLAY
      QT_X11_NO_MITSHM: 1
      XDG_RUNTIME_DIR: /tmp/runtime-${USERNAME}
      __NV_PRIME_RENDER_OFFLOAD: 1
      __GLX_VENDOR_LIBRARY_NAME: nvidia
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /tmp/runtime-${USERNAME}:/tmp/runtime-${USERNAME}
      - ${PROJECT_ROOT}/drake:/home/${USERNAME}/drake
      - ${PROJECT_ROOT}/docker/${FOLDER_NAME}/scripts/setup_container.sh:/setup_container.sh:ro
    ports:
      - 7000-7010:7000-7010
    devices:
      - /dev/dri
    group_add:
      - video
      - render
    gpus: all
    command: ["/bin/bash", "/setup_container.sh"]
