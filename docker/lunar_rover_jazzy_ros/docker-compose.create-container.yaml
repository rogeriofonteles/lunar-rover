services:
  lunar_rover:
    image: lunar-rover-jazzy-ros:v0.0.3
    container_name: ${CONTAINER_NAME}
    hostname: ${CONTAINER_NAME}
    privileged: true
    environment:
      TERM: xterm-256color
      DISPLAY: $DISPLAY
      QT_X11_NO_MITSHM: 1
      XDG_RUNTIME_DIR: /tmp/runtime-${USERNAME}
      __NV_PRIME_RENDER_OFFLOAD: 1
      __GLX_VENDOR_LIBRARY_NAME: nvidia
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /tmp/runtime-${USERNAME}:/tmp/runtime-${USERNAME}
      - ${PROJECT_ROOT}/lunar_rover:/home/${USERNAME}/lunar_rover
      - ${PROJECT_ROOT}/config/dependencies.repos:/dependencies.repos
      - ${PROJECT_ROOT}/docker/${FOLDER_NAME}/scripts/setup_container.sh:/setup_container.sh
      - ${PROJECT_ROOT}/docker/scripts/entrypoint.fish:/entrypoint.fish
    devices:
      - /dev/dri
    group_add:
      - video
      - render
    gpus: all
    command: ["/bin/bash", "/setup_container.sh"]
